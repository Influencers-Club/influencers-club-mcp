[project]
name = "influencers-club-mcp"
version = "0.2.1"
description = "MCP server for the Influencers Club API - creator enrichment, discovery, and batch operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Influencers Club"},
]
keywords = ["mcp", "influencers", "creators", "social-media", "enrichment", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Floor is 1.28.1: everything below it carries HIGH advisories (unverified
    # principal on HTTP session requests, cross-client task access, missing
    # WebSocket Host/Origin validation). Capped below 2.0 because the 2.x SDK
    # drops mcp.server.fastmcp, which server.py imports.
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # TLRUCache (per-entry expiry) backs the token caches; it arrived in 5.0.
    # Capped below the next major like mcp above: it is imported at startup in
    # every mode, so an incompatible release would break every fresh install.
    "cachetools>=5.0,<8",
]

[project.urls]
Homepage = "https://github.com/Influencers-Club/influencers-club-mcp"
Repository = "https://github.com/Influencers-Club/influencers-club-mcp"
Issues = "https://github.com/Influencers-Club/influencers-club-mcp/issues"

[project.scripts]
influencers-club-mcp = "influencers_club_mcp:main"

# Development-only groups (PEP 735); not part of the published package.
# Install with: pip install -e . --group test
[dependency-groups]
test = ["pytest"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["influencers_club_mcp*"]
