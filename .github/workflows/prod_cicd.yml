name: deploy-to-beanstalk-prod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    needs: [build]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Stamp a unique build version
        run: |
          sed -i -E 's/^version = .*/version = "1.0.${{ github.run_number }}"/' pyproject.toml
          grep -E '^version' pyproject.toml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Generate deployment package
        run: zip -r deploy_package_${{ github.sha }}.zip . -x '*.git*'

      - name: Deploy Elastic Beanstalk Application
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key:       ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key:       ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token:    ${{ env.AWS_SESSION_TOKEN }}
          application_name:     ${{ secrets.ELASTIC_APP_NAME }}
          environment_name:     ${{ secrets.ELASTIC_APP_NAME }}
          version_label:        ver-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          existing_bucket_name: ${{ secrets.S3_BUNDLE_NAME }}
          region:               ${{ secrets.AWS_REGION }}
          deployment_package:   deploy_package_${{ github.sha }}.zip
